<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calor Ethics Wordle</title>
  <style>
    :root {
      --red: #df2b2a;
      --red-accent: #b52221;
      --amber: #e08a00;
      --green: #6aaa64;
      --grey: #787c7e;
      --gold: #c9b458;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--red) 0%, #a01f1e 100%);
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, .2);
      text-align: center;
    }

    h1 {
      color: var(--red);
      margin-bottom: 6px;
    }

    .info {
      color: #666;
      font-size: .9em;
      margin-bottom: 14px;
    }

    .message {
      min-height: 28px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .message.win {
      color: var(--green);
    }

    .message.lose {
      color: var(--red);
    }

    .message.error {
      color: var(--amber);
    }

    /* 5 columns x 6 rows */
    .board {
      display: grid;
      grid-template-columns: repeat(5, 56px);
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .board input {
      width: 56px;
      height: 56px;
      border: 2px solid #ccc;
      border-radius: 5px;
      background: #fff;
      color: #000;
      font-size: 1.7em;
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      caret-color: transparent;
      transition: background .3s, border-color .3s, color .3s;
    }

    .board input:disabled {
      background: #fafafa;
      border-color: #e5e5e5;
    }

    .board input:focus {
      outline: none;
      border-color: var(--red);
      box-shadow: 0 0 6px rgba(223, 43, 42, .5);
    }

    .board input.correct {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .board input.present {
      background: var(--gold);
      border-color: var(--gold);
      color: #fff;
    }

    .board input.absent {
      background: var(--grey);
      border-color: var(--grey);
      color: #fff;
    }

    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      padding: 10px 20px;
      font-size: 1em;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
    }

    #submitBtn {
      background: var(--red);
    }

    #submitBtn:hover {
      background: #c41f1f;
    }

    #submitBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #resetBtn {
      background: #a01f1e;
    }

    #resetBtn:hover {
      background: #7a1817;
    }

    .answer {
      margin-top: 14px;
      color: #666;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .overlay-content {
      background-color: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 400px;
      width: 90%;
      color: #333;
    }

    .overlay-content h1 {
      margin-top: 0;
      margin-bottom: 30px;
    }

    #nameForm {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 1em;
    }

    #nameForm label {
      font-size: 16px;
      color: #555;
      font-weight: 600;
    }

    #nameForm input {
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 5px;
      transition: border-color 0.3s;
    }

    #nameForm input:focus {
      outline: none;
      border-color: var(--red);
      box-shadow: 0 0 5px var(--red-accent);
    }

    #nameForm button {
      padding: 12px 20px;
      font-size: 16px;
      background-color: var(--red);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    #nameForm button:hover {
      background-color: var(--red-accent);
    }

    #nameForm button:active {
      transform: scale(0.98);
    }

    /* Hide overlay when it has the 'hidden' class */
    .overlay.hidden {
      display: none;
    }
    .legend {
      color: darkgrey;
      font-size: 11pt;
    }
    .legend .icon {
      font-size: 18pt;
    }
  </style>
</head>

<body>
  <div id="nameOverlay" class="overlay">
    <div class="overlay-content">
      <h1>Welcome to Ethics Wordle!</h1>
      <form id="nameForm">
        <label for="playerName">Please enter your name to start playing:</label>
        <input type="text" id="playerName" name="playerName" placeholder="Your name here" required maxlength="30" autofocus>
        <button type="submit">Start Game</button>
      </form>
      <i style="font-size: 11pt;">Your results will be submitted automatically after finishing the game.</i>
    </div>
  </div>
  <div class="container">
    <div class="logo">
      <svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" width="169.152" height="39.529"
        viewBox="0 0 169.152 39.529" onclick="returnToLanding()">
        <title>CAL-H-RGB</title>
        <g>
          <path
            d="M61.1,7.345A11.925,11.925,0,0,0,48.945,19.534,11.926,11.926,0,0,0,61.1,31.723a12.618,12.618,0,0,0,9.664-4.176L67.4,24.18a8.326,8.326,0,0,1-6.3,2.627c-3.973,0-6.767-3.233-6.767-7.273s2.794-7.273,6.767-7.273a7.822,7.822,0,0,1,5.893,2.39l3.536-3.535A12.487,12.487,0,0,0,61.1,7.345m26.264.235H82.448L72.414,31.319h5.32l1.852-4.479h10.64l1.852,4.479H97.4L87.364,7.58Zm72.191.169H148.78v23.57h5.186V12.53h5.185c2.424,0,4.041,1.145,4.041,3.434s-1.617,3.435-4.041,3.435h-2.357V24.18l2.424,2.593c4.176,4.445,5.859,4.815,8.688,4.815a7.9,7.9,0,0,0,1.246-.068V27.076a3.632,3.632,0,0,1-.438.034c-1.616,0-3.031-.741-5.287-3l-.909-.909a7.3,7.3,0,0,0,5.927-7.374c0-5.32-3.907-8.081-8.89-8.081m-53.167,0H101.2v23.57H118.14V26.47H106.388V7.749ZM81.438,22.261l3.468-8.451,3.468,8.451Zm50.473,4.546a6.964,6.964,0,0,1-6.936-7.273,6.944,6.944,0,1,1,13.872,0,6.925,6.925,0,0,1-6.936,7.273m0-19.462a12.07,12.07,0,0,0-12.256,12.189,12.256,12.256,0,0,0,24.512,0A12.07,12.07,0,0,0,131.911,7.345" />
          <path
            d="M39.611,19.724A19.8,19.8,0,0,0,29.117,2.246V8.132a14.851,14.851,0,1,1-18.623.056V2.246A19.8,19.8,0,1,0,39.611,19.724Zm-8.2,0a11.52,11.52,0,0,0-4.339-9.014,2.905,2.905,0,0,1-1.2-2.367V.871A19.682,19.682,0,0,0,21.5,0V8.291h0v2.4a3.678,3.678,0,0,0,1.541,3.3,6.6,6.6,0,1,1-6.474,0A3.649,3.649,0,0,0,18.184,10.7V0a19.681,19.681,0,0,0-4.365.844v7.5A2.93,2.93,0,0,1,12.6,10.721a11.56,11.56,0,1,0,18.806,9Z"
            fill="#ec1e26" />
        </g>
      </svg>
    </div>
    <h1>🕹️ Ethics Wordle 🕹️</h1>
    <div class="info">Guess the 5-letter word in 6 tries.</div>
    <div class="message" id="message"></div>
    <div class="board" id="board"></div>
    <div class="buttons">
      <button id="submitBtn">Submit</button>
      <button id="resetBtn">Restart</button>
    </div>
    <div class="answer" id="answer"></div>
    <div class="legend">
      <span class="icon" style="color: var(--grey)">■</span> Wrong letter
      <span class="icon" style="color: var(--gold)">■</span> Wrong position
      <span class="icon" style="color: var(--green)">■</span> Correct letter & position
    </div>
  </div>

  <script>
    // ===== CONFIG =====
    const WORD = atob("QlJJQkU=");
    const ROWS = 6, COLS = 5;

    // ===== STATE =====
    let currentRow, gameOver;
    const tiles = [];   // tiles[row][col] = <input>

    const board = document.getElementById("board");
    const message = document.getElementById("message");
    const answer = document.getElementById("answer");
    const submitBtn = document.getElementById("submitBtn");

    let playerName = '';

    // Handle form submission
    document.getElementById('nameForm').addEventListener('submit', function (e) {
      e.preventDefault();

      // Get the player's name
      playerName = document.getElementById('playerName').value.trim();

      if (playerName) {
        // Hide the overlay
        document.getElementById('nameOverlay').classList.add('hidden');
      }

      tiles[0][0].focus();

    });

    // ===== BUILD GRID =====
    for (let r = 0; r < ROWS; r++) {
      tiles[r] = [];
      for (let c = 0; c < COLS; c++) {
        const t = document.createElement("input");
        t.type = "text";
        t.autocomplete = "off";
        t.autocapitalize = "characters";
        t.spellcheck = false;
        t.inputMode = "text";
        t.setAttribute("aria-label", `Row ${r + 1}, letter ${c + 1}`);
        t.addEventListener("focus", () => t.select());
        t.addEventListener("input", () => onInput(r, c));
        t.addEventListener("keydown", e => onKeyDown(e, r, c));
        board.appendChild(t);
        tiles[r][c] = t;
      }
    }

    // ===== INPUT HANDLING =====
    function onInput(r, c) {
      const t = tiles[r][c];
      // keep only the last typed character, letters only
      const letter = t.value.replace(/[^a-zA-Z]/g, "").slice(-1).toUpperCase();
      t.value = letter;
      if (letter && c < COLS - 1) tiles[r][c + 1].focus();
    }

    function onKeyDown(e, r, c) {
      if (e.key === "Enter") {
        e.preventDefault();
        submitGuess();
      } else if (e.key === "Backspace") {
        if (!tiles[r][c].value && c > 0) {
          e.preventDefault();
          tiles[r][c - 1].value = "";
          tiles[r][c - 1].focus();
        }
      } else if (e.key === "ArrowLeft" && c > 0) {
        e.preventDefault();
        tiles[r][c - 1].focus();
      } else if (e.key === "ArrowRight" && c < COLS - 1) {
        e.preventDefault();
        tiles[r][c + 1].focus();
      }
    }

    // ===== GAME LOGIC =====
    function setRowEnabled(r, enabled) {
      tiles[r].forEach(t => (t.disabled = !enabled));
    }

    function showMessage(text, cls = "") {
      message.textContent = text;
      message.className = "message " + cls;
    }

    function evaluate(guess) {
      // Handles duplicate letters correctly
      const result = Array(COLS).fill("absent");
      const remaining = {};
      for (let i = 0; i < COLS; i++) {
        if (guess[i] === WORD[i]) result[i] = "correct";
        else remaining[WORD[i]] = (remaining[WORD[i]] || 0) + 1;
      }
      for (let i = 0; i < COLS; i++) {
        if (result[i] === "correct") continue;
        if (remaining[guess[i]] > 0) {
          result[i] = "present";
          remaining[guess[i]]--;
        }
      }
      return result;
    }

    function submitGuess() {
      if (gameOver) return;
      const guess = tiles[currentRow].map(t => t.value).join("");
      if (guess.length < COLS) {
        showMessage(`Enter a ${COLS}-letter word!`, "error");
        const firstEmpty = tiles[currentRow].find(t => !t.value);
        if (firstEmpty) firstEmpty.focus();
        return;
      }
      showMessage("");

      evaluate(guess).forEach((status, i) => {
        const t = tiles[currentRow][i];
        setTimeout(() => t.classList.add(status), i * 120);
      });

      const row = currentRow;
      setRowEnabled(row, false);

      if (guess === WORD) {
        endGame(true);
      } else if (row === ROWS - 1) {
        endGame(false);
      } else {
        currentRow++;
        setRowEnabled(currentRow, true);
        tiles[currentRow][0].focus();
      }
    }

    function endGame(won) {
      gameOver = true;
      submitBtn.disabled = true;
      if (won) {
        const tries = currentRow + 1;
        showMessage(`🎉 You won in ${tries} ${tries === 1 ? "try" : "tries"}!`, "win");
        let response = submitResult(`🎉 ${playerName} guessed the word '${WORD}' in ${tries} ${tries === 1 ? "try" : "tries"}!`);
      } else {
        showMessage("Game over!", "lose");
        answer.innerHTML = `The word was: <strong>${WORD}</strong>`;
      }
    }

    function startGame() {
      currentRow = 0;
      gameOver = false;
      submitBtn.disabled = false;
      answer.textContent = "";
      showMessage("");
      for (let r = 0; r < ROWS; r++) {
        tiles[r].forEach(t => { t.value = ""; t.className = ""; });
        setRowEnabled(r, r === 0);
      }
      //tiles[0][0].focus();
    }

    function submitResult(result) {
      console.log("function: submitResult invoked");
      // Define the URL to which you want to send the POST request
      const url = 'https://default7b81ccc5ba354bf8854f49f9c02d3f.b1.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/05/workflows/647072a10fb5441d9c954b3ba73e18c8/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=FhNZUqtI7aUErCTBiI3vjWNOlUMeZTDdBjiY4QE5KQg';

      // Define the data you want to send in the POST request
      const data = {
        name: playerName,
        category: result,
        game: "Ethics Wordle"
      };

      // Convert the data to a JSON string
      const jsonData = JSON.stringify(data);

      // Set the headers for the request
      const headers = {
        'Content-Type': 'application/json'
      };

      // Make the POST request using fetch
      fetch(url, {
        method: 'POST', // Specify the HTTP method
        headers: headers, // Include the headers
        body: jsonData // Include the data to be sent
      })
        .then(response => {
          // Check if the request was successful
          if (!response.ok) {
            throw new Error('Network response was not ok ' + response.statusText);
          }
          return response.text();
        })
        .then(data => {
          // Handle the response data
          console.log('Success:', data);
        })
        .catch(error => {
          // Handle any errors that occurred during the request
          console.error('Error:', error);
        });
    };

    submitBtn.addEventListener("click", submitGuess);
    document.getElementById("resetBtn").addEventListener("click", startGame);
    startGame();
  </script>
</body>

</html>
